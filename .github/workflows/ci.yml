name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # Keep channel/components in sync with rust-toolchain.toml;
        # dtolnay/rust-toolchain requires an explicit toolchain input.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@9f151aca7c3990bab7afe2d82ac58088d3b01074 # v2.7.8

      - name: Rust quality gate
        run: python scripts/ci-rust.py

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.95"

      - name: Check MSRV compilation
        run: cargo check --locked --all-features

  docs-and-js:
    name: Docs and dashboard JS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Check release version references
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Raw Cargo.toml
          $match = [regex]::Match($cargoToml, '(?m)^version = "([^"]+)"')
          if (-not $match.Success) {
            throw "Could not read package.version from Cargo.toml"
          }
          $version = $match.Groups[1].Value
          $files = @(
            "README.md",
            "README.zh-CN.md",
            "docs/index.md",
            "docs/zh/index.md",
            "docs/reference/cli.md",
            "docs/zh/reference/cli.md"
          )
          foreach ($file in $files) {
            $content = Get-Content -Raw $file
            if (-not $content.Contains($version)) {
              throw "$file does not mention Cargo package version $version"
            }
          }
          if (-not (Test-Path "docs/package-lock.json")) {
            throw "docs/package-lock.json is required for reproducible docs installs"
          }
          # Scan user-facing docs for stale historical version patterns like 0.N.x.
          # Historical records (CHANGELOG, ADR, PRD archive, reports), source code
          # comments, and upstream reference code legitimately mention old versions,
          # so the scan is limited to README and current-state docs pages.
          $stalePattern = '0\.[0-9]+\.x'
          $scanFiles = @("README.md", "README.zh-CN.md")
          $scanFiles += Get-ChildItem -Recurse "docs" -Filter "*.md" |
            Where-Object { $_.FullName -notmatch '(node_modules|\.vitepress|[\\/](adr|prd|reports)[\\/])' } |
            ForEach-Object { $_.FullName }
          foreach ($f in $scanFiles) {
            $text = Get-Content -Raw $f -ErrorAction SilentlyContinue
            if ($text -match $stalePattern) {
              throw "$f contains stale version reference matching '$stalePattern'"
            }
          }

      - name: Check dashboard benchmark scripts
        run: |
          node --check scripts/benchmark-dashboard-range.mjs
          node --check scripts/benchmark-top-sessions.mjs

      - name: Dashboard JS tests
        run: |
          node --test `
            scripts/tests/benchmark-top-sessions.test.mjs `
            scripts/tests/dashboard-fetch.test.mjs `
            scripts/tests/dashboard-logs-viewer.test.mjs `
            scripts/tests/dashboard-bootstrap-watchdog.test.mjs `
            scripts/tests/dashboard-load-state.test.mjs `
            scripts/tests/dashboard-render-lifecycle.test.mjs

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Build docs
        run: npm --prefix docs run docs:build

  arch-gate:
    name: Architecture checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.0"

      - name: ARCH-002 — sync layer must not depend on commands
        run: cargo test --locked --all-features --test architecture_dependencies

      - name: Module size report (MAINT-001 tracking)
        # Reports oversized files; does not hard-fail until splits are complete.
        shell: bash
        run: |
          echo "=== Module line counts (target: <800 excl. tests) ==="
          for f in src/query/mod.rs src/web/mod.rs src/query/explorer.rs src/store/sync_writer.rs; do
            lines=$(wc -l < "$f")
            flag=""
            if [ "$lines" -gt 800 ]; then flag=" ← over budget"; fi
            echo "$lines  $f$flag"
          done

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-semver-checks

      - name: API-002 semver check (against published crate)
        # Runs only on pushes to main so PR builds are not blocked while the
        # public API is still being stabilised.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo semver-checks --locked

  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.0"

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  # `name` is the GitHub check that branch protection on `main` requires.
  # Do not rename it without updating that required-check list.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - rust
      - msrv
      - docs-and-js
      - arch-gate
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify workflow gate membership
        run: python scripts/check-ci-gate.py

      - name: Require all jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: python scripts/check-ci-gate.py --needs-json "$NEEDS_JSON"
